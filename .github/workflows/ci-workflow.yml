name: DevSecOps — Flutter Project

# Trigger on any push or pull request to any branch
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  devsecops:
    name: DevSecOps Scan & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      # 1) Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Setup Flutter
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'

      - name: Verify Flutter
        run: |
          flutter --version
          flutter doctor -v

      # 3) Install dependencies
      - name: Flutter pub get
        run: flutter pub get

      # 4) Flutter Analyze
      - name: Run Flutter analyze
        run: flutter analyze --write=flutter_analyze_report.json || true

      # 5) Trivy FS scan (filesystem / dependencies)
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@v2
        with:
          scan-type: fs
          format: 'json'
          output: 'trivy_report.json'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          exit-code: '1'

      # 6) Gitleaks secret scan
      - name: Run Gitleaks
        uses: zricethezav/gitleaks-action@v3
        with:
          args: '--path=. --report-format json --report-path gitleaks_report.json'
        continue-on-error: false

      # 7) Build Android APK (release)
      - name: Build Android APK
        run: flutter build apk --release

      # 8) Upload APK as artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # 9) Upload all security reports
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-reports
          path: |
            trivy_report.json
            gitleaks_report.json
            flutter_analyze_report.json
