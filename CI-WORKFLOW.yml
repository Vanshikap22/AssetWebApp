name: DevSecOps — Flutter (Android)

# Run on push / PR for all branches, and scheduled weekly
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    - cron: '0 3 * * 0'   # weekly on Sunday at 03:00 UTC (adjust if needed)

jobs:
  devsecops:
    name: DevSecOps Scan & Build (Flutter Android)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write   # required for CodeQL SARIF uploads

    steps:
      # 1) checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Setup Java + Flutter
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'   # use your version; change if needed

      - name: Verify Flutter
        run: |
          flutter --version
          flutter doctor -v

      # 3) Install dependencies
      - name: Install dependencies
        run: flutter pub get

      ####
      # Static Application Security Testing (CodeQL)
      ####
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: 'javascript,python,go' # include languages CodeQL supports; keep general
          # Note: CodeQL's Dart support may be limited; this still helps scan repo files it supports.

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v2

      ####
      # Dependency / Filesystem vulnerability scan (Trivy)
      ####
      - name: Trivy - Install action & run FS scan
        uses: aquasecurity/trivy-action@v2
        with:
          scan-type: fs
          format: 'json'
          output: 'trivy_report.json'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          exit-code: '1'    # exit code 1 on severity found -> job will fail

      ####
      # Secret scanning (Gitleaks)
      ####
      - name: Run Gitleaks (detect secrets)
        uses: zricethezav/gitleaks-action@v3
        with:
          args: '--path=. --report-format json --report-path gitleaks_report.json'
        continue-on-error: false

      ####
      # Dart / Flutter specific checks
      ####
      - name: Dart Pub Audit (dependency vulnerabilities)
        run: |
          dart pub global activate dart_pub_audit
          dart pub audit --json > dart_audit_report.json || true

      - name: Flutter Analyze (static code analysis)
        run: flutter analyze --write=flutter_analyze_report.json || true

      # Save the logs for the analysis steps (non-fatal by design)
      - name: Save linter & audit outputs
        run: |
          ls -la
          echo "Trivy, gitleaks and reports should be in workspace"

      ####
      # Build APK
      ####
      - name: Build Android APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      ####
      # Upload all reports
      ####
      - name: Upload security & analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-reports
          path: |
            trivy_report.json
            gitleaks_report.json
            dart_audit_report.json
            flutter_analyze_report.json
