name: DevSecOps 

# Run on push / PR for all branches
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  devsecops:
    name: DevSecOps Scan & Build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      # 1) Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Setup Flutter
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'

      - name: Verify Flutter
        run: |
          flutter --version
          flutter doctor -v

      # 3) Install dependencies
      - name: Flutter pub get
        run: flutter pub get

      # 4) CodeQL analysis
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: 'javascript,python,go'

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v2

      # 5) Trivy filesystem scan
      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@v2
        with:
          scan-type: fs
          format: 'json'
          output: 'trivy_report.json'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          exit-code: '1'

      # 6) Gitleaks secret scan
      - name: Run Gitleaks
        uses: zricethezav/gitleaks-action@v3
        with:
          args: '--path=. --report-format json --report-path gitleaks_report.json'
        continue-on-error: false

      # 7) Dart pub audit & flutter analyze
      - name: Dart Pub Audit
        run: |
          dart pub global activate dart_pub_audit
          dart pub audit --json > dart_audit_report.json || true

      - name: Flutter Analyze
        run: flutter analyze --write=flutter_analyze_report.json || true

      # 8) Build Android APK
      - name: Build Android APK (release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # 9) Upload all reports
      - name: Upload security & analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-reports
          path: |
            trivy_report.json
            gitleaks_report.json
            dart_audit_report.json
            flutter_analyze_report.json
